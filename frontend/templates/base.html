<!-- templates/base.html -->
 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TCGNET{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    {% include "components/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/kinetic-card.js' %}" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("[data-query-help-open]").forEach(function (button) {
                button.addEventListener("click", function () {
                    var dialog = document.getElementById(button.dataset.queryHelpOpen);
                    if (!dialog) {
                        return;
                    }
                    if (typeof dialog.showModal === "function") {
                        dialog.showModal();
                    } else {
                        dialog.setAttribute("open", "");
                    }
                });
            });

            document.querySelectorAll(".query-help-modal").forEach(function (dialog) {
                dialog.addEventListener("click", function (event) {
                    if (event.target === dialog) {
                        if (typeof dialog.close === "function") {
                            dialog.close();
                        } else {
                            dialog.removeAttribute("open");
                        }
                    }
                });
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
