<nav class="navbar">
 
    <a href="{% url 'home' %}" class="navbar__brand">
        <div class="navbar__brand-icon">♦</div>
        Card Marketplace
    </a>
 
    <div class="navbar__links">
        {% if user.is_authenticated %}
            <a href="{% url 'collection' %}" class="btn btn-ghost btn-sm">My Collection</a>
            <a href="{% url 'my_listings' %}" class="btn btn-ghost btn-sm">My Listings</a>
            <span class="navbar__welcome">{{ user.username }}</span>
            <form class="navbar__logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost btn-sm">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Login</a>
            <a href="{% url 'register' %}" class="btn btn-gold btn-sm">Register</a>
        {% endif %}
    </div>
 
</nav>
